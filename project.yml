name: LocusCal
options:
  objectVersion: 56
  xcodeVersion: "15.0"
  bundleIdPrefix: studio.locusable
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: studio.locusable.LocusCal
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: LocusCal
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Locusable Studio"
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_NSCalendarsUsageDescription: "在菜单栏弹层中只读显示今天的日程。"
    INFOPLIST_KEY_NSRemindersUsageDescription: "在菜单栏弹层中只读显示今天的提醒事项。"
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "在菜单栏弹层中只读显示今天的日程。"
    INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "在菜单栏弹层中只读显示今天的提醒事项。"
targets:
  LocusCal:
    type: application
    platform: macOS
    sources:
      - path: LocusCal
        excludes:
          - "**/*.md"
      - path: Sources/LocusCalCore
    resources:
      - path: LocusCal/Resources
    settings:
      base:
        PRODUCT_NAME: LocusCal
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
